name: deploy

on:
  push:
  workflow_dispatch:

permissions: {}

defaults:
  run:
    shell: bash -euo pipefail {0}

concurrency:
  # 同じリポジトリの実行を 1 本に保つ。実行中のものは完走させ、待機は最新 1 件に潰す
  group: deploy-${{ github.repository }}
  cancel-in-progress: false

env:
  # ブローカーの公開 URL。OIDC トークンの audience にも使う
  # 空のあいだはビルドとイメージの push までで終わる
  BROKER_URL: https://lab-broker.monica-dev.workers.dev

jobs:
  deploy:
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    permissions:
      # イメージを自分の GHCR へ push する
      packages: write
      # ブローカーへ提示する OIDC トークンを取得する
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # 後続の docker build はリポジトリのコードを実行するため、Git の認証情報を残さない
          persist-credentials: false

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: image
        # GHCR のパスは小文字しか受け付けない
        run: echo "ref=ghcr.io/${GITHUB_REPOSITORY,,}:${GITHUB_SHA}" >> "$GITHUB_OUTPUT"

      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: true
          tags: ${{ steps.image.outputs.ref }}
          # キャッシュは fork のスコープに閉じる
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: デプロイを要求する
        if: env.BROKER_URL != ''
        run: |
          # トークン本体はログへ出さない
          token=$(curl -sS \
            -H "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=${BROKER_URL}" \
            | jq -r .value)

          # デプロイ先もイメージも claim から決まるため、本文は送らない
          curl -sS --fail-with-body -X POST "${BROKER_URL}/deploy" \
            -H "Authorization: Bearer ${token}"

      - name: イメージ参照を残す
        run: |
          {
            echo '```'
            echo "${{ steps.image.outputs.ref }}"
            echo '```'
          } >> "${GITHUB_STEP_SUMMARY}"
